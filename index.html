<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Finans & Borç Takibi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .glass-dark {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white pb-24 md:pb-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [config, setConfig] = useState(() => {
        const saved = localStorage.getItem('gh_finans_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', token: '' };
      });
      
      const [userPin, setUserPin] = useState(() => localStorage.getItem('app_pin') || '');
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [inputPin, setInputPin] = useState('');
      const [pinError, setPinError] = useState('');

      const [isConfigured, setIsConfigured] = useState(false);
      const [items, setItems] = useState([]);
      const [fileSha, setFileSha] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');
      const [showAddModal, setShowAddModal] = useState(false);
      const [showPinResetModal, setShowPinResetModal] = useState(false);
      const [newPinInput, setNewPinInput] = useState('');

      const [form, setForm] = useState({
        title: '',
        category: 'kredi',
        amount: '',
        dueDate: '',
        totalInstallments: '',
        currentInstallment: ''
      });

      useEffect(() => {
        if (config.owner && config.repo && config.token) {
          setIsConfigured(true);
          if (isAuthenticated) {
            fetchDataFromGitHub();
          }
        }
      }, [isConfigured, isAuthenticated]);

      const handleSetInitialPin = (e) => {
        e.preventDefault();
        if (inputPin.trim().length < 4) {
          setPinError('Şifre en az 4 karakter olmalıdır.');
          return;
        }
        localStorage.setItem('app_pin', inputPin.trim());
        setUserPin(inputPin.trim());
        setIsAuthenticated(true);
        setInputPin('');
        setPinError('');
      };

      const handleVerifyPin = (e) => {
        e.preventDefault();
        if (inputPin.trim() === userPin) {
          setIsAuthenticated(true);
          setInputPin('');
          setPinError('');
        } else {
          setPinError('Hatalı şifre! Lütfen tekrar deneyin.');
        }
      };

      const handleChangePin = (e) => {
        e.preventDefault();
        if (newPinInput.trim().length < 4) {
          alert('Yeni şifre en az 4 karakter olmalıdır.');
          return;
        }
        localStorage.setItem('app_pin', newPinInput.trim());
        setUserPin(newPinInput.trim());
        setShowPinResetModal(false);
        setNewPinInput('');
        alert('Şifreniz başarıyla güncellendi!');
      };

      const fetchDataFromGitHub = async () => {
        setLoading(true);
        setError('');
        try {
          const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/data.json`, {
            headers: {
              'Authorization': `Bearer ${config.token}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });
          if (!res.ok) throw new Error('data.json okunamadı. Token veya Repo bilgilerini kontrol edin.');
          const data = await res.json();
          setFileSha(data.sha);
          
          const decodedContent = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
          setItems(JSON.parse(decodedContent || '[]'));
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const saveToGitHub = async (newItems) => {
        setLoading(true);
        setError('');
        try {
          const contentString = JSON.stringify(newItems, null, 2);
          const encodedContent = btoa(unescape(encodeURIComponent(contentString)));

          const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/data.json`, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${config.token}`,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: 'Finans verileri güncellendi',
              content: encodedContent,
              sha: fileSha
            })
          });

          if (!res.ok) throw new Error('Kaydetme başarısız oldu.');
          const result = await res.json();
          setFileSha(result.content.sha);
          setItems(newItems);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem('gh_finans_config', JSON.stringify(config));
        setIsConfigured(true);
      };

      const handleLogout = () => {
        localStorage.removeItem('gh_finans_config');
        setConfig({ owner: '', repo: '', token: '' });
        setIsConfigured(false);
        setIsAuthenticated(false);
        setItems([]);
      };

      const getStatus = (dueDate, isPaid) => {
        if (isPaid) return { label: 'Ödendi', class: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' };
        
        const today = new Date();
        today.setHours(0,0,0,0);
        const due = new Date(dueDate);
        due.setHours(0,0,0,0);

        const diffTime = due.getTime() - today.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays < 0) {
          return { label: `${Math.abs(diffDays)} GÜN GECİKTİ`, class: 'bg-rose-500/10 text-rose-400 border-rose-500/30 animate-pulse' };
        } else if (diffDays <= 5) {
          return { label: `${diffDays === 0 ? 'BUGÜN SON' : diffDays + ' GÜN KALDI'}`, class: 'bg-amber-500/10 text-amber-400 border-amber-500/30' };
        } else {
          return { label: `${diffDays} GÜN VAR`, class: 'bg-sky-500/10 text-sky-400 border-sky-500/30' };
        }
      };

      const togglePaid = (id) => {
        const updated = items.map(item => {
          if (item.id !== id) return item;

          if (item.isPaid) {
            return { ...item, isPaid: false };
          }

          if (item.category === 'kredi' && item.totalInstallments && item.currentInstallment) {
            if (item.currentInstallment < item.totalInstallments) {
              const nextInstallment = item.currentInstallment + 1;
              
              const currentDate = new Date(item.dueDate);
              currentDate.setMonth(currentDate.getMonth() + 1);
              const nextDueDate = currentDate.toISOString().split('T')[0];

              return {
                ...item,
                currentInstallment: nextInstallment,
                dueDate: nextDueDate,
                isPaid: false
              };
            } else {
              return { ...item, isPaid: true };
            }
          }

          return { ...item, isPaid: true };
        });

        saveToGitHub(updated);
      };

      const deleteItem = (id) => {
        if (confirm('Bu kaydı silmek istediğinize emin misiniz?')) {
          const updated = items.filter(item => item.id !== id);
          saveToGitHub(updated);
        }
      };

      const handleAddItem = (e) => {
        e.preventDefault();
        if (!form.title || !form.amount || !form.dueDate) return;

        const newItem = {
          id: Date.now(),
          title: form.title,
          category: form.category,
          amount: parseFloat(form.amount),
          dueDate: form.dueDate,
          isPaid: false,
          totalInstallments: form.category === 'kredi' && form.totalInstallments ? Number(form.totalInstallments) : undefined,
          currentInstallment: form.category === 'kredi' && form.currentInstallment ? Number(form.currentInstallment) : undefined,
        };

        saveToGitHub([newItem, ...items]);
        setShowAddModal(false);
        setForm({ title: '', category: 'kredi', amount: '', dueDate: '', totalInstallments: '', currentInstallment: '' });
      };

      if (!isConfigured) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
            <div className="glass-dark max-w-md w-full p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-2xl border border-indigo-500/20">⚡</div>
                <h1 className="text-2xl font-bold tracking-tight text-white">GitHub Bağlantısı</h1>
                <p className="text-xs text-slate-400">Verilerinizi senkronize etmek için GitHub repo bilgilerinizi girin.</p>
              </div>
              
              <form onSubmit={handleSaveConfig} className="space-y-4">
                <div>
                  <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">GitHub Kullanıcı Adı</label>
                  <input type="text" required value={config.owner} onChange={e => setConfig({...config, owner: e.target.value.trim()})} className="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="Örn: erdemdibek" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">Repo Adı</label>
                  <input type="text" required value={config.repo} onChange={e => setConfig({...config, repo: e.target.value.trim()})} className="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="finans-takip" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">Personal Access Token (PAT)</label>
                  <input type="password" required value={config.token} onChange={e => setConfig({...config, token: e.target.value.trim()})} className="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="ghp_xxxx..." />
                </div>
                <button type="submit" className="w-full bg-gradient-to-r from-indigo-500 to-emerald-500 hover:from-indigo-600 hover:to-emerald-600 text-white py-3.5 rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/20 transition-all active:scale-[0.98]">Sisteme Bağlan</button>
              </form>
            </div>
          </div>
        );
      }

      if (!userPin) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
            <div className="glass-dark max-w-xs w-full p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6 text-center">
              <div className="w-14 h-14 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-2xl border border-indigo-500/20">🛡️</div>
              <div className="space-y-1">
                <h1 className="text-xl font-bold text-white">Güvenlik PIN'i</h1>
                <p className="text-xs text-slate-400">Verilerinize sadece siz erişin.</p>
              </div>
              
              <form onSubmit={handleSetInitialPin} className="space-y-4">
                <input 
                  type="password" 
                  maxLength="8"
                  placeholder="••••" 
                  required 
                  value={inputPin} 
                  onChange={e => setInputPin(e.target.value)} 
                  className="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-center text-2xl tracking-[0.5em] font-mono text-indigo-400 focus:outline-none focus:border-indigo-500" 
                />
                {pinError && <p className="text-xs text-rose-400">{pinError}</p>}
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl text-sm font-bold transition-all active:scale-[0.98]">PIN Oluştur</button>
              </form>
            </div>
          </div>
        );
      }

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
            <div className="glass-dark max-w-xs w-full p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6 text-center">
              <div className="w-14 h-14 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-2xl border border-indigo-500/20">🔐</div>
              <div className="space-y-1">
                <h1 className="text-xl font-bold text-white">Hoş Geldiniz</h1>
                <p className="text-xs text-slate-400">Devam etmek için PIN kodunuzu girin.</p>
              </div>
              
              <form onSubmit={handleVerifyPin} className="space-y-4">
                <input 
                  type="password" 
                  maxLength="8"
                  placeholder="••••" 
                  required 
                  autoFocus
                  value={inputPin} 
                  onChange={e => setInputPin(e.target.value)} 
                  className="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-center text-2xl tracking-[0.5em] font-mono text-indigo-400 focus:outline-none focus:border-indigo-500" 
                />
                {pinError && <p className="text-xs text-rose-400">{pinError}</p>}
                <button type="submit" className="w-full bg-gradient-to-r from-indigo-500 to-emerald-500 text-white py-3.5 rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/20 transition-all active:scale-[0.98]">Kilit Aç</button>
              </form>
            </div>
          </div>
        );
      }

      const calculateRemainingDebt = (item) => {
        if (item.category === 'kredi' && item.totalInstallments && item.currentInstallment) {
          if (item.isPaid) {
            const remainingCount = Math.max(0, item.totalInstallments - item.currentInstallment);
            return remainingCount * item.amount;
          } else {
            const remainingCount = Math.max(0, item.totalInstallments - item.currentInstallment + 1);
            return remainingCount * item.amount;
          }
        } else {
          return item.isPaid ? 0 : item.amount;
        }
      };

      const calculateInitialTotalDebt = (item) => {
        if (item.category === 'kredi' && item.totalInstallments) {
          return item.totalInstallments * item.amount;
        }
        return item.amount;
      };

      const grandInitialTotal = items.reduce((acc, curr) => acc + calculateInitialTotalDebt(curr), 0);
      const totalDebt = items.reduce((acc, curr) => acc + calculateRemainingDebt(curr), 0);
      const paidTotal = Math.max(0, grandInitialTotal - totalDebt);

      const progressPercent = grandInitialTotal > 0 ? Math.min(100, Math.round((paidTotal / grandInitialTotal) * 100)) : 100;

      const totalKredi = items.filter(i => i.category === 'kredi').reduce((acc, curr) => acc + calculateRemainingDebt(curr), 0);
      const totalFatura = items.filter(i => i.category === 'fatura').reduce((acc, curr) => acc + calculateRemainingDebt(curr), 0);
      const totalKisisel = items.filter(i => i.category === 'kisisel').reduce((acc, curr) => acc + calculateRemainingDebt(curr), 0);

      const thisMonthDue = items.filter(i => !i.isPaid).reduce((acc, curr) => acc + curr.amount, 0);

      const filteredItems = items.filter(i => filterCategory === 'all' ? true : i.category === filterCategory);

      const getCategoryIcon = (cat) => {
        switch(cat) {
          case 'kredi': return '💳';
          case 'fatura': return '📄';
          case 'kisisel': return '👤';
          default: return '📌';
        }
      };

      return (
        <div className="max-w-md md:max-w-4xl mx-auto px-4 pt-6 space-y-6">
          
          {/* TOP BAR */}
          <div className="flex items-center justify-between bg-slate-900/80 p-3 pl-4 pr-3 rounded-2xl border border-slate-800 backdrop-blur-md">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center font-bold text-base border border-emerald-500/20">🚀</div>
              <div>
                <h1 className="text-sm font-bold text-white tracking-wide">Finans Özgürlüğü</h1>
                <p className="text-[10px] text-slate-400 font-mono">{config.owner}/{config.repo}</p>
              </div>
            </div>
            <div className="flex items-center gap-1.5">
              <button onClick={fetchDataFromGitHub} className="p-2.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-xs text-slate-300 transition-colors" title="Yenile">🔄</button>
              <button onClick={() => setShowPinResetModal(true)} className="p-2.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-xs text-slate-300 transition-colors" title="Şifre Değiştir">🔑</button>
              <button onClick={() => setIsAuthenticated(false)} className="p-2.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 rounded-xl text-xs border border-amber-500/20 transition-colors" title="Kilitle">🔒</button>
              <button onClick={handleLogout} className="p-2.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl text-xs border border-rose-500/20 transition-colors" title="Çıkış Yap">🚪</button>
            </div>
          </div>

          {error && (
            <div className="bg-rose-500/10 border border-rose-500/30 text-rose-300 p-4 rounded-2xl text-xs flex items-center gap-2">
              <span>⚠️</span>
              <span className="flex-1">{error}</span>
            </div>
          )}

          {/* HERO PREMİUM CARD */}
          <div className="relative overflow-hidden bg-gradient-to-br from-indigo-900 via-slate-900 to-emerald-950 p-6 rounded-3xl border border-indigo-500/30 shadow-2xl space-y-5">
            <div className="absolute top-0 right-0 -mr-12 -mt-12 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute bottom-0 left-0 -ml-12 -mb-12 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div className="flex justify-between items-start relative z-10">
              <div>
                <p className="text-[11px] font-bold tracking-wider uppercase text-indigo-300">Kalan Toplam Borç</p>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-white mt-1 tracking-tight">
                  {totalDebt.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}
                </h2>
              </div>
              <div className="bg-emerald-500/10 border border-emerald-500/30 px-3 py-1.5 rounded-full text-right">
                <span className="text-[10px] uppercase font-semibold text-emerald-400 block">Bu Ay Ödenecek</span>
                <span className="text-sm font-bold text-emerald-300">{thisMonthDue.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}</span>
              </div>
            </div>

            {/* İLERLEME ÇUBUĞU */}
            <div className="space-y-2 relative z-10 pt-2 border-t border-slate-800/80">
              <div className="flex justify-between items-center text-xs">
                <span className="text-slate-300 font-medium">Özgürlük İlerlemesi</span>
                <span className="text-emerald-400 font-bold">% {progressPercent} Tamamlandı 🎉</span>
              </div>
              <div className="w-full bg-slate-950/80 h-3.5 rounded-full p-0.5 border border-slate-800">
                <div 
                  className="bg-gradient-to-r from-indigo-500 via-teal-400 to-emerald-400 h-full rounded-full transition-all duration-1000 shadow-sm"
                  style={{ width: `${progressPercent}%` }}
                ></div>
              </div>
              <p className="text-[11px] text-slate-400 text-center font-medium pt-1">
                {paidTotal > 0 ? `${paidTotal.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })} tutarındaki yükten kurtuldunuz!` : 'Borçları ödedikçe ilerleme çubuğunuz dolacak!'}
              </p>
            </div>
          </div>

          {/* KATEGORİ ÖZET KARTLARI */}
          <div className="grid grid-cols-3 gap-3">
            <div className="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 space-y-1">
              <div className="flex items-center gap-1.5 text-xs text-slate-400">
                <span>💳</span> Kredi
              </div>
              <p className="text-sm font-bold text-white tracking-tight">{totalKredi.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}</p>
            </div>
            <div className="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 space-y-1">
              <div className="flex items-center gap-1.5 text-xs text-slate-400">
                <span>📄</span> Fatura
              </div>
              <p className="text-sm font-bold text-white tracking-tight">{totalFatura.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}</p>
            </div>
            <div className="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 space-y-1">
              <div className="flex items-center gap-1.5 text-xs text-slate-400">
                <span>👤</span> Kişisel
              </div>
              <p className="text-sm font-bold text-white tracking-tight">{totalKisisel.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}</p>
            </div>
          </div>

          {/* FİLTRE VE LİSTE CONTAINER */}
          <div className="space-y-3">
            <div className="flex items-center gap-2 overflow-x-auto pb-1 hide-scrollbar">
              {[
                { key: 'all', label: 'Tüm Ödemeler' },
                { key: 'kredi', label: '💳 Krediler' },
                { key: 'fatura', label: '📄 Faturalar' },
                { key: 'kisisel', label: '👤 Kişisel' }
              ].map(cat => (
                <button 
                  key={cat.key} 
                  onClick={() => setFilterCategory(cat.key)}
                  className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${filterCategory === cat.key ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20' : 'bg-slate-900/80 text-slate-400 border border-slate-800 hover:text-white'}`}
                >
                  {cat.label}
                </button>
              ))}
            </div>

            {/* LİSTE */}
            <div className="space-y-2.5">
              {filteredItems.length === 0 ? (
                <div className="bg-slate-900/40 border border-slate-800/60 rounded-2xl p-8 text-center space-y-2">
                  <div className="text-3xl">✨</div>
                  <p className="text-sm font-medium text-slate-400">Henüz kayıtlı bir borç veya fatura yok.</p>
                </div>
              ) : (
                filteredItems.map(item => {
                  const status = getStatus(item.dueDate, item.isPaid);
                  const itemTotalRemaining = calculateRemainingDebt(item);

                  return (
                    <div 
                      key={item.id} 
                      className={`p-4 rounded-2xl border transition-all ${item.isPaid ? 'bg-slate-950/40 border-slate-900 opacity-60' : 'bg-slate-900/90 border-slate-800/90 hover:border-slate-700'}`}
                    >
                      <div className="flex justify-between items-start gap-3">
                        <div className="flex items-start gap-3">
                          <button 
                            onClick={() => togglePaid(item.id)}
                            className={`mt-0.5 w-6 h-6 rounded-lg border flex items-center justify-center text-xs transition-all ${item.isPaid ? 'bg-emerald-500 border-emerald-500 text-slate-950 font-bold scale-110' : 'border-slate-700 bg-slate-800 hover:border-indigo-500'}`}
                          >
                            {item.isPaid ? '✓' : ''}
                          </button>
                          <div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className={`font-bold text-sm ${item.isPaid ? 'line-through text-slate-500' : 'text-white'}`}>{item.title}</span>
                              <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-medium">
                                {getCategoryIcon(item.category)} {item.category}
                              </span>
                            </div>

                            <p className="text-[11px] text-slate-400 mt-1 flex items-center gap-2">
                              <span>🗓️ {item.dueDate}</span>
                              {item.category === 'kredi' && item.totalInstallments && (
                                <span className="text-indigo-400 font-medium">
                                  ({item.currentInstallment}/{item.totalInstallments} Taksit)
                                </span>
                              )}
                            </p>
                          </div>
                        </div>

                        <div className="text-right flex flex-col items-end">
                          <p className={`font-black text-sm ${item.isPaid ? 'line-through text-slate-500' : 'text-emerald-400'}`}>
                            {item.amount.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}
                          </p>
                          <span className={`text-[9px] px-2 py-0.5 rounded-md font-bold border mt-1 tracking-wider ${status.class}`}>
                            {status.label}
                          </span>
                        </div>
                      </div>

                      {/* Taksitli Kredi Özel Bilgi Alanı */}
                      {item.category === 'kredi' && item.totalInstallments && (
                        <div className="mt-3 pt-2 border-t border-slate-800/60 flex justify-between items-center text-[11px] text-slate-400">
                          <span>Kalan Toplam Borç:</span>
                          <span className="font-bold text-slate-200">{itemTotalRemaining.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}</span>
                        </div>
                      )}

                      <div className="mt-2 flex justify-end">
                        <button onClick={() => deleteItem(item.id)} className="text-[11px] text-rose-400/70 hover:text-rose-400 transition-colors flex items-center gap-1">
                          <span>🗑️</span> Sil
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

          {/* MOBİL FAB */}
          <button 
            onClick={() => setShowAddModal(true)} 
            className="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-r from-indigo-500 to-emerald-500 text-white rounded-full shadow-2xl shadow-indigo-500/50 flex items-center justify-center text-2xl font-bold transition-all active:scale-90 z-40 border border-white/20"
          >
            +
          </button>

          {/* EKLEME MODALI */}
          {showAddModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl animate-in slide-in-from-bottom duration-200">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">Yeni Harcama / Borç Ekle</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleAddItem} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1 font-semibold">Başlık</label>
                    <input type="text" placeholder="Örn: Ev Kredisi veya İnternet" required value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-400 block mb-1 font-semibold">Kategori</label>
                      <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                        <option value="kredi">💳 Kredi</option>
                        <option value="fatura">📄 Fatura</option>
                        <option value="kisisel">👤 Kişisel Borç</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-semibold">Aylık Tutar (TL)</label>
                      <input type="number" step="0.01" placeholder="0.00" required value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-semibold">Son Ödeme Tarihi</label>
                    <input type="date" required value={form.dueDate} onChange={e => setForm({...form, dueDate: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" />
                  </div>

                  {form.category === 'kredi' && (
                    <div className="grid grid-cols-2 gap-2 pt-1">
                      <div>
                        <label className="text-slate-400 block mb-1 font-semibold">Şu Anki Taksit</label>
                        <input type="number" placeholder="Örn: 4" value={form.currentInstallment} onChange={e => setForm({...form, currentInstallment: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1 font-semibold">Toplam Taksit</label>
                        <input type="number" placeholder="Örn: 24" value={form.totalInstallments} onChange={e => setForm({...form, totalInstallments: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" />
                      </div>
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setShowAddModal(false)} className="px-4 py-3 rounded-xl bg-slate-800 text-slate-300 font-semibold w-1/2">İptal</button>
                    <button type="submit" disabled={loading} className="px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-emerald-500 text-white font-bold w-1/2 shadow-lg shadow-indigo-500/20">{loading ? '...' : 'Kaydet'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ŞİFRE DEĞİŞTİRME MODALI */}
          {showPinResetModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                <h3 className="font-bold text-base text-white text-center">PIN Değiştir</h3>
                <form onSubmit={handleChangePin} className="space-y-4 text-xs">
                  <input 
                    type="password" 
                    placeholder="••••" 
                    maxLength="8"
                    required 
                    value={newPinInput} 
                    onChange={e => setNewPinInput(e.target.value)} 
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-center text-2xl tracking-[0.5em] font-mono text-indigo-400 focus:outline-none focus:border-indigo-500" 
                  />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setShowPinResetModal(false)} className="px-4 py-3 rounded-xl bg-slate-800 text-slate-300 font-semibold w-1/2">İptal</button>
                    <button type="submit" className="px-4 py-3 rounded-xl bg-indigo-600 text-white font-bold w-1/2">Güncelle</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
