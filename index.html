<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finans & Borç Takibi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [config, setConfig] = useState(() => {
        const saved = localStorage.getItem('gh_finans_config');
        return saved ? JSON.parse(saved) : { owner: '', repo: '', token: '' };
      });
      const [isConfigured, setIsConfigured] = useState(false);
      const [items, setItems] = useState([]);
      const [fileSha, setFileSha] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');
      const [showAddModal, setShowAddModal] = useState(false);

      const [form, setForm] = useState({
        title: '',
        category: 'kredi',
        amount: '',
        dueDate: '',
        totalInstallments: '',
        currentInstallment: ''
      });

      useEffect(() => {
        if (config.owner && config.repo && config.token) {
          setIsConfigured(true);
          fetchDataFromGitHub();
        }
      }, [isConfigured]);

      const fetchDataFromGitHub = async () => {
        setLoading(true);
        setError('');
        try {
          const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/data.json`, {
            headers: {
              'Authorization': `Bearer ${config.token}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });
          if (!res.ok) throw new Error('data.json okunamadı. Token veya Repo bilgilerini kontrol edin.');
          const data = await res.json();
          setFileSha(data.sha);
          
          const decodedContent = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
          setItems(JSON.parse(decodedContent || '[]'));
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const saveToGitHub = async (newItems) => {
        setLoading(true);
        setError('');
        try {
          const contentString = JSON.stringify(newItems, null, 2);
          const encodedContent = btoa(unescape(encodeURIComponent(contentString)));

          const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/data.json`, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${config.token}`,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: 'Finans verileri güncellendi',
              content: encodedContent,
              sha: fileSha
            })
          });

          if (!res.ok) throw new Error('Kaydetme başarısız oldu.');
          const result = await res.json();
          setFileSha(result.content.sha);
          setItems(newItems);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem('gh_finans_config', JSON.stringify(config));
        setIsConfigured(true);
      };

      const handleLogout = () => {
        localStorage.removeItem('gh_finans_config');
        setConfig({ owner: '', repo: '', token: '' });
        setIsConfigured(false);
        setItems([]);
      };

      const getStatus = (dueDate, isPaid) => {
        if (isPaid) return { label: 'Ödendi', color: 'bg-emerald-100 text-emerald-800 border-emerald-300', type: 'paid' };
        
        const today = new Date();
        today.setHours(0,0,0,0);
        const due = new Date(dueDate);
        due.setHours(0,0,0,0);

        const diffTime = due.getTime() - today.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays < 0) {
          return { label: `${Math.abs(diffDays)} Gün Gecikmede`, color: 'bg-rose-100 text-rose-800 border-rose-300', type: 'overdue' };
        } else if (diffDays <= 5) {
          return { label: `${diffDays === 0 ? 'Bugün Son!' : diffDays + ' Gün Kaldı'}`, color: 'bg-amber-100 text-amber-800 border-amber-300', type: 'upcoming' };
        } else {
          return { label: `${diffDays} Gün Var`, color: 'bg-blue-100 text-blue-800 border-blue-300', type: 'normal' };
        }
      };

      const togglePaid = (id) => {
        const updated = items.map(item => item.id === id ? { ...item, isPaid: !item.isPaid } : item);
        saveToGitHub(updated);
      };

      const deleteItem = (id) => {
        if (confirm('Bu kaydı silmek istediğinize emin misiniz?')) {
          const updated = items.filter(item => item.id !== id);
          saveToGitHub(updated);
        }
      };

      const handleAddItem = (e) => {
        e.preventDefault();
        if (!form.title || !form.amount || !form.dueDate) return;

        const newItem = {
          id: Date.now(),
          title: form.title,
          category: form.category,
          amount: parseFloat(form.amount),
          dueDate: form.dueDate,
          isPaid: false,
          totalInstallments: form.category === 'kredi' ? Number(form.totalInstallments) : undefined,
          currentInstallment: form.category === 'kredi' ? Number(form.currentInstallment) : undefined,
        };

        saveToGitHub([newItem, ...items]);
        setShowAddModal(false);
        setForm({ title: '', category: 'kredi', amount: '', dueDate: '', totalInstallments: '', currentInstallment: '' });
      };

      if (!isConfigured) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white max-w-md w-full p-6 rounded-2xl shadow-md border border-slate-200 space-y-4">
              <h1 className="text-xl font-bold text-center text-slate-800">GitHub Bağlantısı</h1>
              <p className="text-xs text-slate-500 text-center">Verilerinizin saklanacağı GitHub reponuzun bilgilerini girin.</p>
              
              <form onSubmit={handleSaveConfig} className="space-y-3">
                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">GitHub Kullanıcı Adı</label>
                  <input type="text" required value={config.owner} onChange={e => setConfig({...config, owner: e.target.value.trim()})} className="w-full border rounded-xl p-2 text-sm" placeholder="Örn: kullanıcıAdın" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Repo Adı</label>
                  <input type="text" required value={config.repo} onChange={e => setConfig({...config, repo: e.target.value.trim()})} className="w-full border rounded-xl p-2 text-sm" placeholder="finans-takip" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600 block mb-1">Personal Access Token (PAT)</label>
                  <input type="password" required value={config.token} onChange={e => setConfig({...config, token: e.target.value.trim()})} className="w-full border rounded-xl p-2 text-sm" placeholder="ghp_xxxx..." />
                </div>
                <button type="submit" className="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-semibold">Sisteme Bağlan</button>
              </form>
            </div>
          </div>
        );
      }

      const totalDebt = items.filter(i => !i.isPaid).reduce((acc, curr) => acc + curr.amount, 0);
      const overdueCount = items.filter(i => !i.isPaid && getStatus(i.dueDate, false).type === 'overdue').length;
      const upcomingCount = items.filter(i => !i.isPaid && getStatus(i.dueDate, false).type === 'upcoming').length;

      const filteredItems = items.filter(i => filterCategory === 'all' ? true : i.category === filterCategory);

      return (
        <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6">
          <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border">
            <div>
              <h1 className="text-xl font-bold">Borç & Takip Paneli</h1>
              <p className="text-xs text-slate-500">{config.owner}/{config.repo}</p>
            </div>
            <div className="flex gap-2">
              <button onClick={fetchDataFromGitHub} className="p-2 bg-slate-100 rounded-xl text-xs font-semibold">🔄 Yenile</button>
              <button onClick={handleLogout} className="p-2 bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold">Çıkış</button>
              <button onClick={() => setShowAddModal(true)} className="px-3 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">+ Ekle</button>
            </div>
          </div>

          {error && <div className="bg-rose-100 text-rose-800 p-3 rounded-xl text-xs">{error}</div>}

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-white p-4 rounded-2xl border shadow-sm">
              <p className="text-xs font-semibold text-slate-400">Kalan Toplam Borç</p>
              <p className="text-xl font-bold text-slate-800 mt-1">{totalDebt.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl border shadow-sm">
              <p className="text-xs font-semibold text-slate-400">Geciken Kalemler</p>
              <p className="text-xl font-bold text-rose-600 mt-1">{overdueCount} Adet</p>
            </div>
            <div className="bg-white p-4 rounded-2xl border shadow-sm">
              <p className="text-xs font-semibold text-slate-400">Yaklaşan (5 Gün)</p>
              <p className="text-xl font-bold text-amber-600 mt-1">{upcomingCount} Adet</p>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border p-4">
            <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
              {['all', 'kredi', 'fatura', 'kisisel'].map(cat => (
                <button 
                  key={cat} 
                  onClick={() => setFilterCategory(cat)}
                  className={`px-3 py-1 rounded-lg text-xs font-semibold capitalize ${filterCategory === cat ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}
                >
                  {cat === 'all' ? 'Tümü' : cat}
                </button>
              ))}
            </div>

            <div className="divide-y">
              {filteredItems.length === 0 ? (
                <p className="text-center py-8 text-slate-400 text-xs">Kayıtlı veri yok.</p>
              ) : (
                filteredItems.map(item => {
                  const status = getStatus(item.dueDate, item.isPaid);
                  return (
                    <div key={item.id} className="py-3 flex justify-between items-center text-sm">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className={`font-semibold ${item.isPaid ? 'line-through text-slate-400' : ''}`}>{item.title}</span>
                          {item.totalInstallments && <span className="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded font-mono">{item.currentInstallment}/{item.totalInstallments}</span>}
                        </div>
                        <p className="text-[11px] text-slate-500">Son Ödeme: {item.dueDate}</p>
                      </div>

                      <div className="flex items-center gap-3">
                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold border ${status.color}`}>{status.label}</span>
                        <span className={`font-bold text-xs ${item.isPaid ? 'text-slate-400' : ''}`}>{item.amount.toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' })}</span>
                        <button onClick={() => togglePaid(item.id)} className="text-xs bg-slate-100 p-1.5 rounded">{item.isPaid ? '↩' : '✓'}</button>
                        <button onClick={() => deleteItem(item.id)} className="text-xs text-rose-500 p-1.5">🗑</button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

          {showAddModal && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-sm">Yeni Borç / Fatura Ekle</h3>
                <form onSubmit={handleAddItem} className="space-y-2 text-xs">
                  <input type="text" placeholder="Başlık (Örn: Garanti Kredisi)" required value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="w-full border rounded-xl p-2" />
                  <div className="grid grid-cols-2 gap-2">
                    <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="border rounded-xl p-2">
                      <option value="kredi">Kredi</option>
                      <option value="fatura">Fatura</option>
                      <option value="kisisel">Kişisel Borç</option>
                    </select>
                    <input type="number" step="0.01" placeholder="Tutar (TL)" required value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} className="border rounded-xl p-2" />
                  </div>
                  <input type="date" required value={form.dueDate} onChange={e => setForm({...form, dueDate: e.target.value})} className="w-full border rounded-xl p-2" />
                  {form.category === 'kredi' && (
                    <div className="grid grid-cols-2 gap-2">
                      <input type="number" placeholder="Mevcut Taksit" value={form.currentInstallment} onChange={e => setForm({...form, currentInstallment: e.target.value})} className="border rounded-xl p-2" />
                      <input type="number" placeholder="Toplam Taksit" value={form.totalInstallments} onChange={e => setForm({...form, totalInstallments: e.target.value})} className="border rounded-xl p-2" />
                    </div>
                  )}
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAddModal(false)} className="px-3 py-1.5 rounded-xl bg-slate-100">İptal</button>
                    <button type="submit" disabled={loading} className="px-3 py-1.5 rounded-xl bg-indigo-600 text-white font-semibold">{loading ? '...' : 'Kaydet'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
